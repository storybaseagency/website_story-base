# Baut die Website und lädt sie per FTPS (lftp) zu All-Inkl hoch.
#
# Benötigte Secrets (Repo → Settings → Secrets and variables → Actions):
#   FTP_SERVER     z. B. w0123456.kasserver.com
#   FTP_USERNAME   FTP-Benutzer aus dem All-Inkl-KAS
#   FTP_PASSWORD   Passwort des FTP-Benutzers
# Optional:
#   FTP_SERVER_DIR Zielordner auf dem Server, Standard "/" (muss mit "/" enden)

name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-artifact@v5
        with:
          name: website
          path: out/
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Prüfen, ob FTP-Zugangsdaten hinterlegt sind
        if: env.FTP_SERVER == ''
        run: echo "::warning::FTP-Secrets fehlen – Upload übersprungen. Siehe README."

      - uses: actions/download-artifact@v5
        if: env.FTP_SERVER != ''
        with:
          name: website
          path: out/

      - name: lftp installieren
        if: env.FTP_SERVER != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # lftp statt FTP-Deploy-Action: All-Inkl verlangt bei FTPS die Wiederaufnahme
      # der TLS-Sitzung auf der Datenverbindung, sonst bricht sie ab (ECONNRESET).
      - name: Per FTPS zu All-Inkl hochladen
        if: env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || '/' }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 30;
            open --env-password -u \"$FTP_USERNAME\" \"$FTP_SERVER\";
            mirror --reverse --verbose --parallel=4 --no-perms out/ \"$FTP_SERVER_DIR\";
          "
